spring.application.name=vetly-java

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8
spring.flyway.baseline-description=Baseline - schema existente

spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.security=INFO

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

vetly.admin.bootstrap.email=${VETLY_ADMIN_BOOTSTRAP_EMAIL}
vetly.admin.bootstrap.senha=${VETLY_ADMIN_BOOTSTRAP_SENHA}
